name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # The package's root tsconfig.json extends expo-module-scripts/tsconfig.base.
      # The docs build doesn't install the package's own dependencies, but Vite
      # still reads that tsconfig, so give it an empty base to extend.
      - name: Stub expo-module-scripts/tsconfig.base for the docs build
        working-directory: .
        run: |
          mkdir -p node_modules/expo-module-scripts
          echo '{"compilerOptions":{}}' > node_modules/expo-module-scripts/tsconfig.base.json

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
